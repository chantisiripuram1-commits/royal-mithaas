
{% extends "base.html" %}
{% block title %}My Orders | Royal Mithaas{% endblock %}

{% block content %}

<section class="inner-banner">
    <div class="container text-center">
        <h1>My Orders</h1>
        <p>Keep track of your sweet orders.</p>
    </div>
</section>

<section class="page-section">
<div class="container">

    <div class="form-card">
        <h2 class="mb-4">Your Order History</h2>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Product</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <span style="font-size:45px">🛍️</span>
                            <h4 class="mt-3">No Orders Yet</h4>
                            <p>Your orders will appear here.</p>
                            <a href="/products" class="main-button">Explore Sweets</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>
</section>

{% endblock %}
